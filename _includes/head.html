<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.title and page.url != "/" %}
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  {%- else %}
  <title>{{ site.title | escape }} &mdash; Associate Professor in Computer Science</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta name="author" content="{{ site.author.name | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/picture.jpg' | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
